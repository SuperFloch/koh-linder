<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Planche — vie de camp</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&amp;family=Rubik:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
a{color:#f5b942}a:hover{color:#e8d49a}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; font-family: 'Rubik', sans-serif; color: #e8d49a; background: {{sky}}">

<!-- Paysage : plage avec jungle derrière, ciel selon la période -->
<svg aria-hidden="true" style="position: absolute; inset: 0" width="390" height="844" viewBox="0 0 390 844" preserveAspectRatio="none">
<rect x="0" y="0" width="390" height="844" fill="{{sky}}"></rect>
<circle cx="80" cy="210" r="38" fill="{{sun}}" opacity="0.9"></circle>
<path d="M0 470c40-50 90-60 130-30 30-40 80-50 120-20 40-30 100-30 140 10v140H0z" fill="#1f4220"></path>
<path d="M0 520c50-30 110-34 160-10 50-26 130-30 230 0v100H0z" fill="#2f5a26"></path>
<g fill="none" stroke="#1a100d" stroke-width="6" stroke-linecap="round"><path d="M60 600c4-40 0-80-10-110"></path><path d="M330 610c-2-46 4-86 14-116"></path></g>
<g fill="#244a1f"><path d="M50 490c-26-4-44 6-52 22 18-12 36-14 52-22z"></path><path d="M50 490c16-20 38-26 58-18-22 2-40 10-58 18z"></path><path d="M50 490c-6-22-26-34-46-34 18 8 34 18 46 34z"></path><path d="M344 494c-20-18-42-22-60-12 22 0 42 4 60 12z"></path><path d="M344 494c10-22 30-32 50-26-20 4-36 14-50 26z"></path></g>
<path d="M250 560l30-24 30 24v26h-60z" fill="#6b4129"></path><path d="M244 562l36-30 36 30" fill="none" stroke="#4a2c1d" stroke-width="6" stroke-linejoin="round"></path>
<path d="M0 600c90-18 220-20 390-4v248H0z" fill="#e8d49a"></path>
<path d="M0 660c100-12 230-10 390 2v182H0z" fill="#dcc283"></path>
<path d="M0 740h390v104H0z" fill="#3a9fc0" opacity="0"></path>
</svg>
<div style="position: absolute; inset: 0; background: {{shade}}"></div>

<div style="position: relative; height: 100%; display: flex; flex-direction: column">

<!-- Header bois, avatar au centre -->
<div style="position: relative; display: grid; grid-template-columns: minmax(0, 1fr) 76px minmax(0, 1fr); align-items: center; gap: 10px; padding: 12px 16px; background: #4a2c1d; border-bottom: 3px solid #1a100d; box-shadow: inset 0 -2px 0 #6b4129">
<div style="display: flex; flex-direction: column; gap: 2px; min-width: 0">
<span style="font-family: 'Lilita One', sans-serif; font-size: 22px; line-height: 1">Jour 8</span>
<span style="font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: #f5b942">Survie · {{periodName}}</span>
</div>
<button aria-label="Votre fiche et la liste des candidats" style="justify-self: center; width: 72px; height: 72px; margin-bottom: -34px; border-radius: 50%; border: 4px solid #e8d49a; background: #1a100d; box-shadow: 0 0 0 3px #1a100d, 0 6px 14px rgba(11,26,40,.6); color: #e8d49a; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: 'Lilita One', sans-serif; font-size: 26px; line-height: 1; position: relative; z-index: 2">L<span style="font-family: 'Rubik', sans-serif; font-size: 8px; letter-spacing: 1px">[AVATAR]</span></button>
<div style="display: flex; flex-direction: column; gap: 5px; min-width: 0">
<div style="display: flex; justify-content: space-between; font-size: 11px; font-weight: 700"><span>Énergie</span><span>38</span></div>
<div role="img" aria-label="Énergie 38 sur 100" style="height: 12px; border-radius: 6px; background: #1a100d; border: 2px solid #6b4129; overflow: hidden"><div style="height: 100%; width: 38%; background: #f5b942"></div></div>
</div>
</div>

<!-- Bandeau du camp (sable) -->
<div style="display: flex; flex-direction: column; gap: 8px; margin: 44px 16px 0; padding: 8px 10px; border-radius: 10px; background: #e8d49a; color: #1a100d; border: 2px solid #4a2c1d; box-shadow: 0 4px 0 #4a2c1d">
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; font-size: 11px; text-align: center">
<div style="display: flex; flex-direction: column; gap: 1px"><span style="font-family: 'Lilita One', sans-serif; font-size: 16px">12<span style="font-size: 10px">/20</span></span><span>Eau</span></div>
<div style="display: flex; flex-direction: column; gap: 1px; border-left: 1px solid #c9ae6e"><span style="font-family: 'Lilita One', sans-serif; font-size: 16px">7</span><span>Bois</span></div>
<div style="display: flex; flex-direction: column; gap: 1px; border-left: 1px solid #c9ae6e"><span style="font-family: 'Lilita One', sans-serif; font-size: 16px">18</span><span>Vivres</span></div>
<div style="display: flex; flex-direction: column; align-items: center; gap: 1px; border-left: 1px solid #c9ae6e">
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="#e0553f" stroke="#1a100d" stroke-width="1.6" stroke-linejoin="round"><path d="M12 22c4 0 7-2.6 7-6.5 0-3.2-2.4-5.6-3.6-8-1 2-2 3-3.4 3.4C12.5 7.5 11 4.5 8.5 2 8.5 6 5 9 5 15.5 5 19.4 8 22 12 22z"></path></svg>
<span>Feu allumé</span></div>
</div>
<div style="display: flex; align-items: center; gap: 8px; font-size: 11px">
<span style="font-weight: 700">Cabane</span>
<div style="flex: 1; display: grid; grid-template-columns: repeat(15, minmax(0, 1fr)); gap: 2px">
<sc-for list="{{cabin}}" as="s" hint-placeholder-count="15"><div style="height: 8px; border-radius: 2px; background: {{s.bg}}"></div></sc-for>
</div>
<span style="font-weight: 700">6/15</span>
</div>
<div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); border-radius: 6px; overflow: hidden; background: #4a2c1d">
<sc-for list="{{periods}}" as="p" hint-placeholder-count="6">
<div style="padding: 4px 0; text-align: center; font-size: 9.5px; font-weight: 700; background: {{p.bg}}; color: {{p.fg}}">{{p.label}}</div>
</sc-for>
</div>
</div>

<!-- Carte -->
<div style="flex: 1; display: flex; align-items: center; justify-content: center; min-height: 0">
<div style="position: relative; width: 262px; height: 370px; box-sizing: border-box; padding: 7px; border-radius: 14px; background: #4a2c1d; border: 2px solid #1a100d; box-shadow: 0 16px 30px rgba(26,16,13,.45)">
<div style="height: 100%; box-sizing: border-box; border-radius: 8px; background: #e8d49a; color: #1a100d; display: flex; flex-direction: column; overflow: hidden">
<div style="height: 120px; flex: none; position: relative; overflow: hidden">
<svg aria-hidden="true" style="position: absolute; inset: 0" width="248" height="120" viewBox="0 0 248 120" preserveAspectRatio="xMidYMid slice"><rect width="248" height="120" fill="{{sky}}"></rect><path d="M0 70c40-24 90-28 130-10 40-18 80-20 118 0v60H0z" fill="#2f5a26"></path><path d="M0 92c80-10 170-10 248 0v28H0z" fill="#e8d49a"></path><path d="M150 92l22-18 22 18v14h-44z" fill="#6b4129"></path><path d="M70 100c0-8 6-12 10-18 4 6 10 10 10 18z" fill="#f5b942"></path><path d="M64 104h32" stroke="#4a2c1d" stroke-width="4" stroke-linecap="round"></path></svg>
<span style="position: absolute; left: 8px; bottom: 5px; font-size: 9px; color: #4a2c1d">[Illustration]</span>
</div>
<div style="padding: 10px 12px 0; display: flex; justify-content: space-between; font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase; color: #6b4129"><span>{{periodName}} · 2 actions</span><span>1 / 3</span></div>
<div style="padding: 4px 12px 0; font-family: 'Lilita One', sans-serif; font-size: 19px; line-height: 1.15">Où passez-vous la matinée ?</div>
<div style="display: flex; flex-direction: column; gap: 5px; margin: 8px 10px 0; padding: 7px 8px; border-radius: 6px; background: #dcc684">
<span style="font-size: 9px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase">Choix de l'équipe</span>
<sc-for list="{{plans}}" as="plan" hint-placeholder-count="3">
<div style="display: flex; align-items: center; gap: 6px; font-size: 11.5px">
<span style="width: 20px; height: 20px; flex: none; border-radius: 50%; background: #1a100d; color: #e8d49a; border: 2px solid #e0553f; display: flex; align-items: center; justify-content: center; font-size: 9px; font-weight: 700">{{plan.initial}}</span>
<span><b>{{plan.names}}</b> · {{plan.task}}</span>
</div>
</sc-for>
</div>
<div style="margin-top: auto; display: flex; justify-content: center; padding: 6px 0 8px">
<svg role="img" aria-label="Décision : glisser à gauche ou à droite" width="64" height="18" viewBox="0 0 64 18" fill="none" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M26 9H4m6-6-6 6 6 6" stroke="#2f5a26"></path><path d="M38 9h22m-6-6 6 6-6 6" stroke="#1d3f63"></path></svg>
</div>
</div>
</div>
</div>

<!-- Choix -->
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; padding: 0 16px 22px">
<button style="min-height: 56px; border-radius: 10px; border: 2px solid #1a100d; background: #2f5a26; color: #f2e6bf; font-family: 'Rubik', sans-serif; font-size: 14px; font-weight: 700; box-shadow: 0 4px 0 #1a100d; display: flex; align-items: center; gap: 8px; padding: 0 12px">
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5m6-6-6 6 6 6"></path></svg>
<span>Hors du camp</span>
</button>
<button style="min-height: 56px; border-radius: 10px; border: 2px solid #1a100d; background: #1d3f63; color: #f2e6bf; font-family: 'Rubik', sans-serif; font-size: 14px; font-weight: 700; box-shadow: 0 4px 0 #1a100d; display: flex; align-items: center; justify-content: flex-end; gap: 8px; padding: 0 12px">
<span>Au camp</span>
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14m-6-6 6 6-6 6"></path></svg>
</button>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"currentPeriod":{"editor":"enum","default":"Matin","options":["Réveil","Matin","Midi","Après-midi","Soir","Nuit"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const current = this.props.currentPeriod ?? 'Matin';
const names = ['Réveil', 'Matin', 'Midi', 'Après-midi', 'Soir', 'Nuit'];
const skies = { 'Réveil': '#f2b07e', 'Matin': '#9ad6ea', 'Midi': '#74c6ec', 'Après-midi': '#8cc7e0', 'Soir': '#e98a5c', 'Nuit': '#1b2f55' };
const suns = { 'Réveil': '#ffe2a8', 'Matin': '#fff4cf', 'Midi': '#ffffff', 'Après-midi': '#fff4cf', 'Soir': '#ffcf7a', 'Nuit': '#e8e4d0' };
const shades = { 'Nuit': 'rgba(10,20,40,.35)', 'Soir': 'rgba(60,20,10,.12)' };
const idx = names.indexOf(current);
const periods = names.map((n, i) => ({
label: n === 'Après-midi' ? 'Ap.-midi' : n,
bg: i === idx ? '#f5b942' : 'transparent',
fg: i === idx ? '#1a100d' : (i < idx ? '#a88a6a' : '#e8d49a')
}));
const cabin = [];
for (let i = 0; i < 15; i++) cabin.push({ bg: i < 6 ? '#6b4129' : '#cdb680' });
const plans = [
{ initial: 'A', names: 'Alice, Bob', task: 'pêche' },
{ initial: 'C', names: 'Cara', task: 'bois' },
{ initial: 'Y', names: 'Yanis', task: 'discussion' }
];
return { sky: skies[current], sun: suns[current], shade: shades[current] || 'transparent', periodName: current, periods: periods, cabin: cabin, plans: plans };
}
}
</script>
</body>
</html>
